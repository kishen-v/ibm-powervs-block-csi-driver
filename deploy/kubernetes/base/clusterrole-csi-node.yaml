---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: powervs-node-role
  labels:
    app.kubernetes.io/name: ibm-powervs-block-csi-driver
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    # "patch" is the minimum RBAC verb for writing node fields; scoped to
    # /spec/providerID via JSON Patch "test"+"add" at the operation level.
    verbs: ["get", "patch"]
